url: https://tidyvisor.in4metrix.dev/

template:
  bootstrap: 5
  includes:
    # Readers can switch the site between light and dark (light-switch
    # below); plots keep a white background in both (extra.css).
    # The CSP allows only the site's own scripts; static hosting cannot
    # always send security headers, so they are set as meta tags.
    in_header: |
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
      <meta name="referrer" content="strict-origin-when-cross-origin">
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "tidyvisor hex logo"
  light-switch: true
  bslib:
    primary: "#1A9E93"
    secondary: "#0E2A47"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: 1rem
    line-height-base: 1.65
    headings-font-weight: 700
    link-color: "#13857B"
    navbar-bg: "#0E2A47"
    border-radius: 0.5rem

# Every figure on an opaque white background so no plot ever shows the
# dark theme through it.
figures:
  bg: white
  dev.args:
    bg: white

repo:
  url:
    home: https://github.com/jmozez/tidyvisor/
    source: https://github.com/jmozez/tidyvisor/blob/main/
    issue: https://github.com/jmozez/tidyvisor/issues/
  branch: main

navbar:
  bg: dark
  structure:
    left: [intro, userguide, tutorials, reference, news, ecosystem, search, github]
    right: []
  components:
    ecosystem:
      text: Ecosystem
      icon: fa-cubes
      aria-label: Companion packages that work together with the tidyverse and tidymodels
      menu:
        - text: Packages that work together
        - text: "tidydiversity: Taxonomic, phylogenetic and functional diversity"
          icon: fa-leaf
          href: https://tidydiversity.in4metrix.dev/
        - text: "tidymapr: Spatial analysis, remote sensing and maps"
          icon: fa-map
          href: https://tidymapr.in4metrix.dev/
        - text: "tidyvisor: Statistical advice and interpretation"
          icon: fa-compass
          href: https://tidyvisor.in4metrix.dev/
        - text: "tidyepidemio: Epidemiological analysis"
          icon: fa-virus
          href: https://tidyepidemio.in4metrix.dev/
    github:
      icon: fa-github
      aria-label: Source code on GitHub
      href: https://github.com/jmozez/tidyvisor
    intro:
      text: Get started
      href: articles/tidyvisor.html
    userguide:
      text: User guide
      menu:
        - text: Overview
          href: articles/user-guide.html
        - text: -------
        - text: 1. Research practice and study design
          href: articles/practice.html
        - text: 2. Power analysis before fieldwork
          href: articles/power.html
        - text: 3. Checking assumptions and choosing the test
          href: articles/assumptions.html
        - text: 4. Regression and generalised linear models
          href: articles/regression.html
        - text: 5. Mixed, additive and overdispersed models
          href: articles/mixed.html
        - text: 6. Bayesian models
          href: articles/bayesian.html
        - text: 7. Community and spatial ecology
          href: articles/ecology.html
        - text: 8. Writing your own advisor
          href: articles/extending.html
    tutorials:
      text: Tutorials
      menu:
        - text: Overview
          href: articles/tutorials.html
        - text: -------
        - text: A diet experiment, from plan to report
          href: articles/tutorial-experiment.html
        - text: Comparing treatments with counts
          href: articles/tutorial-counts.html
    news:
      text: News
      href: news/index.html

home:
  title: "tidyvisor: a statistical advisor for research in R"
  description: >
    A chief statistician for R: advice on study design, sample size and
    research practice before the data are collected, on the analysis and
    its assumptions before it is run, and plain-language interpretation of
    the results after it, with the reasons and the code.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

reference:
  - title: The advisor
    contents:
      - tidyvisor
      - advise
      - interpret
      - tv_save
  - title: Research practice, design and power
    contents:
      - practice-advisor
      - power-advisor
  - title: Statistical models and tests
    contents:
      - regression-advisor
      - compare-advisor
      - model-advisors
      - brms-advisor
  - title: Model checks, equivalence and confounding
    contents:
      - tv_check_model
      - tv_equivalence
      - tv_evalue
  - title: Community ecology
    contents:
      - vegan-advisor
  - title: Advisors from other packages
    contents:
      - advisors
      - register_advisor

articles:
  - title: Get started
    navbar: ~
    contents:
      - tidyvisor
  - title: User guide
    contents:
      - articles/user-guide
      - articles/practice
      - articles/power
      - articles/assumptions
      - articles/regression
      - articles/mixed
      - articles/bayesian
      - articles/ecology
      - articles/extending
  - title: Tutorials
    contents:
      - articles/tutorials
      - articles/tutorial-experiment
      - articles/tutorial-counts

footer:
  structure:
    left: [developed_by]
    right: [built_with]
